name: Build macOS

# ============================================================
# MODELO DE DISTRIBUCIÓN: DIRECTA Y FUERA DE TIENDAS
# ============================================================
# Todo el ecosistema BDJ Studio se distribuye directamente.
# Este workflow genera exclusivamente artefactos para distribución directa:
# GitHub Actions Artifacts y Releases (sin requerir firma comercial de Apple).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            target: aarch64-apple-darwin
            runner: macos-15
          - architecture: x64
            target: x86_64-apple-darwin
            runner: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout bdj_license_core (dzapataba/bdjstudiolicensecore)
        uses: actions/checkout@v4
        with:
          repository: dzapataba/bdjstudiolicensecore
          path: bdj_license_core
          token: ${{ secrets.CORE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show environment
        run: |
          flutter --version
          rustc --version
          cargo --version
          uname -m

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: |
          mkdir -p ../../bdj_license_core 2>/dev/null || true
          cp -R bdj_license_core/* ../../bdj_license_core/ 2>/dev/null || cp -R "$GITHUB_WORKSPACE/bdj_license_core"/* ../../bdj_license_core/ || true
          cd frontend
          flutter pub get

      - name: Analyze Flutter project
        run: |
          cd frontend
          flutter analyze

      - name: Run Flutter tests
        run: |
          cd frontend
          flutter test

      - name: Build Rust Native Engine (Release - ${{ matrix.target }})
        run: |
          cd engine
          cargo build --release -p bdja_ffi --target ${{ matrix.target }}

      - name: Build macOS Application (Release)
        run: |
          cd frontend
          flutter build macos --release

      - name: Bundle Native Library into .app Frameworks
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find frontend/build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No se encontró el bundle .app compilado."
            exit 1
          fi
          echo "Bundle localizado: $APP_PATH"
          FRAMEWORKS_DIR="$APP_PATH/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS_DIR"
          
          DYLIB_SRC="engine/target/${{ matrix.target }}/release/libbdja_ffi.dylib"
          if [ ! -f "$DYLIB_SRC" ]; then
            echo "::error::No se encontró la librería nativa en $DYLIB_SRC"
            exit 1
          fi
          
          cp "$DYLIB_SRC" "$FRAMEWORKS_DIR/libbdja_ffi.dylib"
          echo "Librería copiada a $FRAMEWORKS_DIR/libbdja_ffi.dylib"

      - name: Ad-Hoc Code Signing (Permite ejecución directa sin firma de pago)
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find frontend/build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          echo "Firmando ad-hoc de forma profunda: $APP_PATH"
          xattr -cr "$APP_PATH" 2>/dev/null || true
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --verbose "$APP_PATH"

      - name: Package ZIP with ditto (Conserva atributos ejecutables)
        id: app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find frontend/build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          APP_NAME="$(basename "$APP_PATH" .app)"
          ZIP_NAME="BDJ-Studio-Audio-Analyzer-macOS-${{ matrix.architecture }}.zip"
          
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 Checksum
        shell: bash
        run: |
          shasum -a 256 *.zip > checksums-macOS-${{ matrix.architecture }}.sha256
          cat checksums-macOS-${{ matrix.architecture }}.sha256

      - name: Upload macOS ZIP & SHA-256 to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BDJ-Studio-Audio-Analyzer-macOS-${{ matrix.architecture }}
          path: |
            *.zip
            *.sha256
          if-no-files-found: error
          retention-days: 30
