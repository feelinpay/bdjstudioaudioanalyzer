name: Build macOS

# ============================================================
# MODELO DE DISTRIBUCIÓN: DIRECTA Y FUERA DE TIENDAS
# ============================================================
# Todo el ecosistema BDJ Studio se distribuye directamente por el desarrollador.
# Genera exclusivamente artefactos para distribución directa: GitHub Actions Artifacts y Releases.
# Genera 2 paquetes independientes: Apple Silicon (arm64) e Intel (x64).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - architecture: x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout bdj_license_core (dzapataba/bdjstudiolicensecore)
        uses: actions/checkout@v4
        with:
          repository: dzapataba/bdjstudiolicensecore
          path: bdj_license_core
          token: ${{ secrets.CORE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show environment
        run: |
          flutter --version
          cargo --version
          rustc --version
          xcodebuild -version
          uname -m

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Link bdj_license_core and Install Flutter dependencies
        run: |
          # Asegurar que el path relativo ../../bdj_license_core funcione desde frontend/ como en BDJ Studio Sample Pad y Search Pro
          mkdir -p "$GITHUB_WORKSPACE/../bdj_license_core" 2>/dev/null || true
          cp -R "$GITHUB_WORKSPACE/bdj_license_core"/* "$GITHUB_WORKSPACE/../bdj_license_core/" 2>/dev/null || cp -R bdj_license_core/* "$GITHUB_WORKSPACE/../bdj_license_core/" || true
          cd frontend
          mkdir -p ../../bdj_license_core 2>/dev/null || true
          cp -R ../bdj_license_core/* ../../bdj_license_core/ 2>/dev/null || cp -R "$GITHUB_WORKSPACE/bdj_license_core"/* ../../bdj_license_core/ || true
          flutter pub get

      - name: Run Engine Tests
        run: |
          cd engine
          cargo test --workspace --target ${{ matrix.rust_target }}

      - name: Compile Native Engine in Release (${{ matrix.architecture }})
        run: |
          cd engine
          cargo build --release --target ${{ matrix.rust_target }} -p bdja_ffi -p bdja_cli

      - name: Run Flutter Analyze & Tests
        run: |
          cd frontend
          flutter analyze
          flutter test

      - name: Build macOS Application (Release)
        run: |
          cd frontend
          flutter build macos --release

      - name: Integrate Native Libraries into Application Bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find frontend/build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No se encontró la aplicación .app generada en Release"
            exit 1
          fi
          echo "Integrando binarios nativos en: $APP_PATH"
          mkdir -p "$APP_PATH/Contents/Frameworks" "$APP_PATH/Contents/MacOS"
          
          RUST_OUT="engine/target/${{ matrix.rust_target }}/release"
          if [ ! -d "$RUST_OUT" ]; then
            RUST_OUT="engine/target/release"
          fi
          
          cp "$RUST_OUT/libbdja_ffi.dylib" "$APP_PATH/Contents/Frameworks/"
          cp "$RUST_OUT/libbdja_ffi.dylib" "$APP_PATH/Contents/MacOS/"
          cp "$RUST_OUT/bdja_cli" "$APP_PATH/Contents/MacOS/" || true
          chmod +x "$APP_PATH/Contents/MacOS/bdja_cli" 2>/dev/null || true

      - name: Ad-Hoc Code Signing (Permite ejecución directa sin firma de pago)
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find frontend/build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          echo "Firmando ad-hoc de forma profunda: $APP_PATH"
          xattr -cr "$APP_PATH" 2>/dev/null || true
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --verbose "$APP_PATH"

      - name: Package ZIP with ditto (Conserva atributos ejecutables)
        id: app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find frontend/build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          APP_NAME="$(basename "$APP_PATH" .app)"
          ZIP_NAME="BDJ-Studio-Audio-Analyzer-macOS-${{ matrix.architecture }}.zip"
          
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 Checksum
        shell: bash
        run: |
          shasum -a 256 *.zip > checksums-macOS-${{ matrix.architecture }}.sha256
          cat checksums-macOS-${{ matrix.architecture }}.sha256

      - name: Upload macOS ZIP & SHA-256 to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BDJ-Studio-Audio-Analyzer-macOS-${{ matrix.architecture }}
          path: |
            *.zip
            *.sha256
          if-no-files-found: error
          retention-days: 30
